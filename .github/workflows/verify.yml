name: Cluera verification
on:
  pull_request:
  push:
    branches: [main, staging, codex/clean-cluera-setup]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm ci --prefix backend
      # The packaging test loads desktop/electron-builder.cluera.cjs, which reads
      # electron/checksums.json. Scripts are skipped so no Electron binary downloads.
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run test:preparation
      - run: npm run verify:source
      - run: npm --prefix web test -- --maxWorkers=1
      - run: npm --prefix web run typecheck
      - run: npm --prefix backend run typecheck
      - run: npm run build:web
      - run: npm run build:backend
      - run: npm audit --prefix web --audit-level=moderate
      - run: npm audit --prefix backend --audit-level=moderate
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop test -- --maxWorkers=1
      - run: npm --prefix desktop run typecheck
      - run: npm run build:desktop
      - run: npm audit --prefix desktop --audit-level=moderate
      # Intentionally no secrets, deploy, installer publication or schema apply.
      # Remaining moderate advisories keep this job red until safely resolved.
